<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lagkart-Quiz</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    /* ====== Grundläggande stilar (återanvänds från live.html) ====== */
    :root { --border:#d0d7de }
    body { margin:0; font-family:system-ui,Segoe UI,Roboto,Arial }
    header { padding:8px 12px; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--border); flex-wrap:wrap }
    .pill { border:1px solid var(--border); border-radius:999px; padding:2px 8px; font-size:12px }
    .box { padding:8px 12px }
    input, select, button { padding:6px 8px }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
    .muted { color:#666; font-size:12px }
    button { cursor:pointer }
    .hidden { display:none }
    #credit { position:fixed; right:10px; bottom:8px; opacity:.5; font-size:12px; pointer-events:none }

    /* ====== Kartor ====== */
    #map { height:45vh; touch-action:manipulation }
    #map2 { height:40vh }

    /* ====== Canvas ====== */
    #drawCanvas {
      width:100%; aspect-ratio:4/3;
      border:1px solid var(--border); cursor:crosshair;
      touch-action:none; background:#fff; display:block
    }
    #viewCanvas {
      width:100%; aspect-ratio:4/3;
      border:1px solid var(--border);
      background:#fff; display:block
    }
    #canvasTools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 0 }

    /* ====== Lagfärger ====== */
    .team-badge {
      border-radius:4px; padding:2px 8px; font-size:12px;
      color:#fff; display:inline-block; font-weight:600
    }

    /* ====== Modal ====== */
    .modal {
      position:fixed; inset:0; background:rgba(0,0,0,.4);
      display:none; align-items:center; justify-content:center; padding:16px
    }
    .modal-card {
      background:#fff; border-radius:16px; padding:16px;
      max-width:420px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.25)
    }
    .modal-card h2 { margin:0 0 8px }

    /* ====== Lobby-konfiguration ====== */
    .team-config {
      border:1px solid var(--border); border-radius:8px;
      padding:8px; margin:4px 0
    }

    /* ====== Resultatlistor ====== */
    #teamStandings li, #finalList li {
      display:flex; justify-content:space-between;
      padding:4px 0; border-bottom:1px solid #eee
    }

    /* ====== Kartmarkering för åskådare ====== */
    .map-inactive { pointer-events:none }

    /* ====== Anslutningsstatus-prickar i lobby-listan ====== */
    .dot-online  { display:inline-block; width:9px; height:9px; border-radius:50%; background:#4caf50; margin-right:4px; vertical-align:middle }
    .dot-offline { display:inline-block; width:9px; height:9px; border-radius:50%; background:#ccc;    margin-right:4px; vertical-align:middle }
  </style>
</head>
<body>

<!-- ====== Sidhuvud ====== -->
<header>
  <strong>Lagkart-Quiz</strong>
  <span id="status" class="muted">Inte ansluten</span>
  <span id="roundInfo" class="pill hidden">—</span>
  <span id="drawingInfo" class="pill hidden">—</span>
</header>

<!-- ====== LOBBY-VY ====== -->
<div id="lobbyView" class="box">

  <!-- VY A: Startsida – välj om du vill skapa eller gå med i ett spel -->
  <div id="startView">
    <h3 style="margin:0 0 14px">Lagkart-Quiz</h3>
    <div class="row">
      <button id="goToHostSetupBtn" style="padding:10px 18px;font-size:15px">🚀 Skapa nytt spel</button>
      <button id="goToJoinBtn"      style="padding:10px 18px;font-size:15px">🎮 Gå med i spel</button>
    </div>
  </div>

  <!-- VY B: Host-setup – konfigurera lagnamn, omgångar och poängsättning -->
  <div id="hostSetupView" class="hidden">
    <h3 style="margin:0 0 8px">Konfigurera lagspel</h3>

    <!-- Antal lag (2–5) -->
    <div class="row" style="margin:6px 0">
      <label>Antal lag (2–5):</label>
      <button id="teamsDecrBtn" style="width:32px">−</button>
      <strong id="numTeamsDisplay">2</strong>
      <button id="teamsIncrBtn" style="width:32px">+</button>
    </div>

    <!-- Dynamisk lagkonfiguration (bara lagnamn – inga spelarnamn) -->
    <div id="teamsConfig"></div>

    <!-- Antal omgångar -->
    <div class="row" style="margin:8px 0">
      <label>Antal omgångar (1–30):</label>
      <input type="number" id="totalRoundsInput" value="12" min="1" max="30" style="width:60px"/>
    </div>

    <!-- Spelare per lag -->
    <div class="row" style="margin:6px 0">
      <label>Spelare per lag:</label>
      <select id="playersPerTeamSelect">
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>

    <!-- Poängsättningsläge -->
    <div class="row" style="margin:6px 0">
      <label>Poängsättning:</label>
      <select id="scoringModeSelect">
        <option value="average">Medel (alla gissningar)</option>
        <option value="best">Bäst gissning</option>
      </select>
    </div>

    <div class="row" style="margin-top:10px">
      <button id="createTeamGameBtn">🚀 Skapa spel</button>
      <button id="backToStartFromHostBtn" style="border:1px solid #ccc;background:none;color:#555">← Tillbaka</button>
    </div>
  </div>

  <!-- VY C: Väntrum – visas för ALLA (inklusive hosten) efter att spelet skapats/anslutits -->
  <div id="waitingRoomView" class="hidden">

    <!-- Spelkod – bara synlig för hosten -->
    <div id="hostCodeSection" class="hidden"
         style="margin-bottom:14px;padding:10px 14px;background:#f0f8ff;border-radius:8px;border:1px solid #c0d8f0">
      <div class="muted" style="margin-bottom:6px">📢 Dela koden med de andra spelarna!</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <strong id="gameCodeValue" style="font-size:2em;letter-spacing:6px;font-family:monospace">——</strong>
        <button id="copyCodeBtn">📋 Kopiera</button>
      </div>
    </div>

    <!-- Join-formulär: visas för alla som inte ännu valt lag (inklusive hosten) -->
    <div id="lobbyJoinSection">
      <h4 style="margin:0 0 8px">Gå med i ett lag</h4>

      <!-- Namnfält -->
      <div class="row" style="margin-bottom:8px">
        <input id="lobbyNameInput" placeholder="Ditt namn" style="width:160px"/>
      </div>

      <!-- Kodinput + Fortsätt-knapp (visas bara för spelare, inte hosten) -->
      <div id="lobbyCodeRow" style="display:none;margin-bottom:8px" class="row">
        <input id="lobbyCodeInput" placeholder="Spelkod (6 siffror)" maxlength="6" style="width:175px"/>
        <button id="lobbyLookupBtn">Fortsätt →</button>
      </div>

      <!-- Lagknappar (visas direkt för hosten, efter kod för spelare) -->
      <div id="lobbyTeamBtns" style="display:none" class="row"></div>
    </div>

    <!-- Live-lista: lag med spelare och anslutningsstatus (grön/grå prick) -->
    <div id="lobbyTeamsList" style="margin-top:12px"></div>

    <!-- Starta-knapp (bara synlig och klickbar för hosten, disabled tills klart) -->
    <button id="startTeamGameBtn" class="hidden" disabled style="margin-top:12px">⏳ Väntar på spelare...</button>

  </div>

</div>

<!-- ====== SPELVY ====== -->
<div id="gameView" class="hidden">

  <!-- Statusrad: vem ritar, vilken stad etc. -->
  <div class="box" style="padding-bottom:4px">
    <span id="gameStatusText" class="muted">—</span>
  </div>

  <!-- RITARENS stadval (visas bara för ritaren, döljs när stad valts) -->
  <div id="cityChoiceSection" class="box hidden">
    <strong>Du ritar! Välj en stad:</strong>
    <div id="cityChoiceBtns" class="row" style="margin-top:8px"></div>
  </div>

  <!-- CANVAS för ritaren (visas efter stadval) -->
  <div id="drawerCanvasSection" class="hidden" style="padding:0 12px 8px">
    <div id="canvasTools">
      <span class="muted" style="font-size:11px">Pensel:</span>
      <button class="brushBtn" data-size="4" title="Smal">S</button>
      <button class="brushBtn" data-size="10" title="Medium">M</button>
      <button class="brushBtn" data-size="20" title="Tjock">L</button>
      <input type="color" id="colorPicker" value="#222222" title="Välj färg"
             style="width:36px;height:32px;padding:2px;cursor:pointer;border:1px solid var(--border)"/>
      <button id="clearCanvasBtn">🗑️ Rensa</button>
    </div>
    <canvas id="drawCanvas"></canvas>
    <div id="drawerWaitText" class="muted hidden" style="font-size:13px;padding:4px 0">
      ⏳ Väntar på att ditt lag ska gissa...
    </div>
  </div>

  <!-- CANVAS för mottagare: gissare och åskådare ser ritarens streck -->
  <div id="viewerCanvasSection" class="hidden" style="padding:0 12px 8px">
    <canvas id="viewCanvas"></canvas>
  </div>

  <!-- KARTA: gissaren kan klicka, åskådaren kan inte -->
  <div id="mapSection" class="hidden">
    <div id="map"></div>
    <div id="guessStatus" class="box muted">Placera nålen på kartan!</div>
  </div>

</div>

<!-- ====== RESULTATVY ====== -->
<div id="resultsView" class="hidden">
  <!-- Karta med rätt svar och gissningar -->
  <div id="map2"></div>
  <div class="box">
    <div id="subRoundResult" style="margin-bottom:10px"></div>
    <strong>Lagställning:</strong>
    <ol id="teamStandings" style="padding-left:1.2em; margin:4px 0 10px"></ol>
    <!-- Bara hosten ser "Nästa"-knappen -->
    <button id="nextSubRoundBtn" class="hidden">Nästa omgång →</button>
  </div>
</div>

<!-- ====== SLUTRESULTAT-MODAL ====== -->
<div id="finalModal" class="modal">
  <div class="modal-card">
    <h2>🏆 Slutresultat</h2>
    <ol id="finalList" style="padding-left:1.2em; margin:0 0 12px"></ol>
    <button id="finalClose">Stäng</button>
  </div>
</div>

<div id="credit">Ett spel av Jesper Pettersson</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
// ====== Serveradress ======
const SERVER_URL = "https://geo-live-server.onrender.com";

// ====== Spelkonstanter ======
const MAX_PLAYERS_PER_TEAM = 3; // Max antal spelare per lag

// ====== Distinkt färg per lag (index 0–4) ======
const TEAM_COLORS = ['#e53935', '#1e88e5', '#43a047', '#fb8c00', '#8e24aa'];

// Mappar lagnamn → färgindex för att hålla konsekvent lagfärg under hela spelet
let teamColorMap = new Map();

function buildTeamColorMap(teams) {
  if (!teams?.length) return;
  teams.forEach((team, i) => {
    if (!teamColorMap.has(team.name)) {
      teamColorMap.set(team.name, i % TEAM_COLORS.length);
    }
  });
}

function getTeamColor(teamName) {
  const idx = teamColorMap.has(teamName) ? teamColorMap.get(teamName) : 0;
  return TEAM_COLORS[idx];
}

// ====== Globalt tillstånd ======
let socket = null;
let _connectPromise = null;
let gameId  = null;
// isHost: sant om denna klient skapade spelet (styr om spelkod och startknapp visas)
let isHost  = false;
// Aktuell roll för denna klient: null (ej valt lag) | 'drawer' | 'guesser' | 'spectator'
// Rollen null används tills spelaren anslutit till ett lag
let myRole  = null;
let myTeamName  = null;     // Spelarens lagnamn (sätts vid player:teamJoined)
let myTeamId    = null;     // Spelarens lag-ID (sätts vid player:teamJoined)
let myPlayerId  = null;     // Spelarens ID
let currentGameCode = null; // Spelkoden – används av hosten vid lag-join
let totalRounds = 12;
let numTeams    = 2;        // Antal lag att konfigurera (host-setup)

// Canvas-tillstånd
let isDrawing    = false;
let drawColor    = '#222222';
let drawLineWidth = 4;       // Ritarens penselbredd i px
let prevDrawPoint = null;    // Föregående punkt för kontinuerliga streck (viewCanvas)

// Kartor (Leaflet-instanser)
let guessMap       = null;
let guessLayer     = null;
let myGuessMarker  = null;
let mapClickEnabled = false; // Sant bara för gissaren

let resultMap   = null;
let resultLayer = null;

// Canvas-kontexter
const drawCanvas = document.getElementById('drawCanvas');
const viewCanvas = document.getElementById('viewCanvas');
let drawCtx = drawCanvas.getContext('2d');
let viewCtx = viewCanvas.getContext('2d');

// ====== Vy-hantering: visa enbart en vy åt gången ======
function showView(viewId) {
  ['lobbyView', 'gameView', 'resultsView'].forEach(id => {
    document.getElementById(id).classList.toggle('hidden', id !== viewId);
  });
  // Leaflet behöver invalideras efter att en dold karta visas
  if (viewId === 'gameView' && guessMap) {
    setTimeout(() => guessMap.invalidateSize(), 100);
  }
  if (viewId === 'resultsView' && resultMap) {
    setTimeout(() => resultMap.invalidateSize(), 100);
  }
}

// Växlar mellan lobby-subvyerna A (start), B (host-setup) och C (väntrum)
function showLobbySubView(viewId) {
  ['startView', 'hostSetupView', 'waitingRoomView'].forEach(id => {
    document.getElementById(id).classList.toggle('hidden', id !== viewId);
  });
}

// ====== LOBBY: Konfigurera lag (bara lagnamn – inga spelarnamn) ======
const numTeamsDisplay = document.getElementById('numTeamsDisplay');
const teamsConfig     = document.getElementById('teamsConfig');

// Bygger formulär med enbart lagnamn (spelare lägger till sina egna namn i väntrumet)
function renderTeamsConfig() {
  teamsConfig.innerHTML = '';
  for (let t = 0; t < numTeams; t++) {
    const color = TEAM_COLORS[t % TEAM_COLORS.length];
    const div   = document.createElement('div');
    div.className = 'team-config';
    div.innerHTML = `
      <div class="row">
        <span class="team-badge" style="background:${color}">Lag ${t + 1}</span>
        <input type="text" class="teamNameInput" data-team="${t}"
               placeholder="Lagnamn" value="Lag ${t + 1}" style="width:150px"/>
      </div>
    `;
    teamsConfig.appendChild(div);
  }
}

// Antal lag: minska / öka
document.getElementById('teamsDecrBtn').onclick = () => {
  if (numTeams > 2) { numTeams--; numTeamsDisplay.textContent = numTeams; renderTeamsConfig(); }
};
document.getElementById('teamsIncrBtn').onclick = () => {
  if (numTeams < 5) { numTeams++; numTeamsDisplay.textContent = numTeams; renderTeamsConfig(); }
};

renderTeamsConfig(); // Bygg initial lagkonfiguration (2 lag)

// ====== Navigering mellan lobby-subvyerna ======

// Vy A → Vy B (host-setup)
document.getElementById('goToHostSetupBtn').onclick = () => {
  showLobbySubView('hostSetupView');
};

// Vy A → Vy C (spelare: visa kodinput direkt i väntrumet)
document.getElementById('goToJoinBtn').onclick = () => {
  showLobbySubView('waitingRoomView');
  // Visa kod- och Fortsätt-raden för spelare (hosten ser den inte)
  document.getElementById('lobbyCodeRow').style.display = 'flex';
};

// Vy B → Vy A (tillbaka)
document.getElementById('backToStartFromHostBtn').onclick = () => {
  showLobbySubView('startView');
};

// ====== Socket.io: Anslut till servern (med wake-up ping för Render) ======
async function connect() {
  if (socket) return;
  if (!_connectPromise) {
    _connectPromise = (async () => {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Väcker servern – vänta…';
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 60000);
        await fetch(SERVER_URL + '/health', { signal: ctrl.signal });
        clearTimeout(tid);
      } catch (_) { /* fortsätt ändå */ }
      socket = io(SERVER_URL, { transports: ['websocket', 'polling'], timeout: 60000 });
      socket.on('connect',    () => statusEl.textContent = 'Ansluten');
      socket.on('disconnect', () => statusEl.textContent = 'Inte ansluten');
      socket.on('connect_error', (err) => {
        statusEl.textContent = 'Anslutningsfel – försöker igen…';
        console.error('Socket connect_error:', err.message, err.description ?? '', err.context ?? '');
      });
      bindSocketEvents();
    })();
  }
  return _connectPromise;
}

// ====== Host: Skapa lagspel ======
document.getElementById('createTeamGameBtn').onclick = async () => {
  await connect();
  isHost = true;
  const totalRoundsVal = Math.min(30, Math.max(1,
    parseInt(document.getElementById('totalRoundsInput').value, 10) || 12));
  const scoringMode = document.getElementById('scoringModeSelect').value;

  // Samla bara lagnamn – spelarna anger sina egna namn i väntrumet
  const teamNames = [];
  for (let t = 0; t < numTeams; t++) {
    const nameInput = teamsConfig.querySelector(`.teamNameInput[data-team="${t}"]`);
    teamNames.push((nameInput?.value || `Lag ${t + 1}`).trim());
  }
  const playersPerTeam = parseInt(document.getElementById('playersPerTeamSelect').value, 10) || 2;

  socket.emit('host:createTeamGame', {
    totalRounds: totalRoundsVal,
    scoringMode,
    numTeams,
    teamNames,
    playersPerTeam
  });
};

// Host: Starta spelet (aktiveras när alla lag har minst 2 spelare)
document.getElementById('startTeamGameBtn').onclick = () => {
  if (socket && gameId) socket.emit('host:startTeamGame', { gameId });
};

// Kopierings-knapp för spelkoden (bara synlig för hosten)
document.getElementById('copyCodeBtn').onclick = () => {
  const code = document.getElementById('gameCodeValue').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('copyCodeBtn');
    btn.textContent = '✅ Kopierad!';
    setTimeout(() => { btn.textContent = '📋 Kopiera'; }, 2000);
  });
};

// Spelare: "Fortsätt →" – anslut till lobbyrummet för att se lagen
document.getElementById('lobbyLookupBtn').onclick = async () => {
  await connect();
  const code = (document.getElementById('lobbyCodeInput').value || '').replace(/\D/g, '');
  const name = (document.getElementById('lobbyNameInput').value || '').trim();
  if (code.length !== 6) return alert('Skriv en giltig 6-siffrig spelkod.');
  if (!name) return alert('Skriv ditt namn.');
  // Gå med i lobbyrummet utan att välja lag ännu – servern svarar med teamLobby:update
  socket.emit('player:joinTeamLobby', { code, name });
};

// Hjälpfunktion: skicka lag-join-begäran (används av lagknapparna i väntrumet)
function handleJoinTeamClick(teamId) {
  const code = isHost
    ? currentGameCode
    : (document.getElementById('lobbyCodeInput').value || '').replace(/\D/g, '');
  const name = (document.getElementById('lobbyNameInput').value || '').trim();
  if (!name) return alert('Skriv ditt namn.');
  if (!code) return alert('Spelkoden saknas.');
  socket.emit('player:joinTeamByTeamId', { code, name, teamId });
}

// ====== Leaflet-kartor ======

// Initialiserar gissningskartan (#map, används under spelvyn)
function initGuessMap() {
  if (guessMap) return;
  const worldBounds = L.latLngBounds(L.latLng(-85, -180), L.latLng(85, 180));
  guessMap = L.map('map', {
    zoomControl:          true,
    attributionControl:   false,
    minZoom:              1,
    maxBounds:            worldBounds,
    maxBoundsViscosity:   1.0,
    worldCopyJump:        false
  }).setView([25, 10], 2);
  guessMap.setMaxBounds(worldBounds);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    maxZoom: 19, subdomains: 'abcd', noWrap: true, bounds: worldBounds,
    attribution: '© OpenStreetMap, © CARTO'
  }).addTo(guessMap);
  guessLayer = L.layerGroup().addTo(guessMap);

  // Klick på kartan = gissning (bara om mapClickEnabled är sant)
  guessMap.on('click', e => {
    if (!mapClickEnabled || !socket || !gameId) return;
    if (myGuessMarker) guessMap.removeLayer(myGuessMarker);
    myGuessMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(guessMap);
    socket.emit('team:submitGuess', { gameId, lat: e.latlng.lat, lng: e.latlng.lng });
  });
}

// Initialiserar resultatkartan (#map2, används i resultstvyn)
function initResultMap() {
  if (resultMap) return;
  const worldBounds = L.latLngBounds(L.latLng(-85, -180), L.latLng(85, 180));
  resultMap = L.map('map2', {
    zoomControl:          true,
    attributionControl:   false,
    minZoom:              1,
    maxBounds:            worldBounds,
    maxBoundsViscosity:   1.0,
    worldCopyJump:        false
  }).setView([25, 10], 2);
  resultMap.setMaxBounds(worldBounds);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    maxZoom: 19, subdomains: 'abcd', noWrap: true, bounds: worldBounds,
    attribution: '© OpenStreetMap, © CARTO'
  }).addTo(resultMap);
  resultLayer = L.layerGroup().addTo(resultMap);
}

// ====== Canvas-hantering ======

// Sätt canvasens interna upplösning till dess CSS-storlek
function resizeCanvas(canvas) {
  const rect = canvas.getBoundingClientRect();
  if (rect.width > 0 && rect.height > 0) {
    canvas.width  = rect.width;
    canvas.height = rect.height;
  }
}

// Rita ett streck på viewCanvas från normaliserade koordinater (0–1)
// 'drawing: false' = lyft pennan (ny linje börjar), 'drawing: true' = drag linje
function drawOnViewCanvas(nx, ny, drawing, color, normalizedLineWidth) {
  if (!viewCtx) return;
  if (!drawing) {
    // Lyft pennan – spara startpunkten för nästa segment
    prevDrawPoint = { nx, ny };
    return;
  }
  if (!prevDrawPoint) { prevDrawPoint = { nx, ny }; return; }

  // Avnormalisera koordinater till faktiska pixlar
  const x0 = prevDrawPoint.nx * viewCanvas.width;
  const y0 = prevDrawPoint.ny * viewCanvas.height;
  const x1 = nx * viewCanvas.width;
  const y1 = ny * viewCanvas.height;

  // Skala linjebredden proportionellt mot canvas-bredden
  const lineWidth = Math.max(1, normalizedLineWidth * viewCanvas.width);

  viewCtx.strokeStyle = color;
  viewCtx.lineWidth   = lineWidth;
  viewCtx.lineCap     = 'round';
  viewCtx.lineJoin    = 'round';
  viewCtx.beginPath();
  viewCtx.moveTo(x0, y0);
  viewCtx.lineTo(x1, y1);
  viewCtx.stroke();

  prevDrawPoint = { nx, ny };
}

// Hämtar musposition relativt canvasytan, normaliserat till 0–1
function getCanvasPos(canvas, clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  return { x, y, nx: x / canvas.width, ny: y / canvas.height };
}

// --- Mus-händelsehanterare för ritaren ---

drawCanvas.addEventListener('mousedown', e => {
  if (myRole !== 'drawer') return;
  const { x, y, nx, ny } = getCanvasPos(drawCanvas, e.clientX, e.clientY);
  isDrawing = true;
  drawCtx.beginPath();
  drawCtx.moveTo(x, y);
  // Normalisera linjebredd relativt canvas-bredden
  socket?.emit('team:draw', {
    gameId, x: nx, y: ny,
    drawing: false, color: drawColor,
    lineWidth: drawLineWidth / drawCanvas.width
  });
});

drawCanvas.addEventListener('mousemove', e => {
  if (!isDrawing || myRole !== 'drawer') return;
  const { x, y, nx, ny } = getCanvasPos(drawCanvas, e.clientX, e.clientY);
  drawCtx.strokeStyle = drawColor;
  drawCtx.lineWidth   = drawLineWidth;
  drawCtx.lineCap     = 'round';
  drawCtx.lineJoin    = 'round';
  drawCtx.lineTo(x, y);
  drawCtx.stroke();
  drawCtx.beginPath();
  drawCtx.moveTo(x, y);
  socket?.emit('team:draw', {
    gameId, x: nx, y: ny,
    drawing: true, color: drawColor,
    lineWidth: drawLineWidth / drawCanvas.width
  });
});

function stopDrawing() {
  if (!isDrawing) return;
  isDrawing = false;
  drawCtx?.beginPath();
  socket?.emit('team:draw', {
    gameId, x: 0, y: 0,
    drawing: false, color: drawColor,
    lineWidth: drawLineWidth / drawCanvas.width
  });
}
drawCanvas.addEventListener('mouseup',    stopDrawing);
drawCanvas.addEventListener('mouseleave', stopDrawing);

// --- Touch-händelsehanterare för ritaren (mobil) ---

drawCanvas.addEventListener('touchstart', e => {
  if (myRole !== 'drawer') return;
  e.preventDefault();
  const t = e.touches[0];
  const { x, y, nx, ny } = getCanvasPos(drawCanvas, t.clientX, t.clientY);
  isDrawing = true;
  drawCtx.beginPath();
  drawCtx.moveTo(x, y);
  socket?.emit('team:draw', {
    gameId, x: nx, y: ny,
    drawing: false, color: drawColor,
    lineWidth: drawLineWidth / drawCanvas.width
  });
}, { passive: false });

drawCanvas.addEventListener('touchmove', e => {
  if (!isDrawing || myRole !== 'drawer') return;
  e.preventDefault();
  const t = e.touches[0];
  const { x, y, nx, ny } = getCanvasPos(drawCanvas, t.clientX, t.clientY);
  drawCtx.strokeStyle = drawColor;
  drawCtx.lineWidth   = drawLineWidth;
  drawCtx.lineCap     = 'round';
  drawCtx.lineJoin    = 'round';
  drawCtx.lineTo(x, y);
  drawCtx.stroke();
  drawCtx.beginPath();
  drawCtx.moveTo(x, y);
  socket?.emit('team:draw', {
    gameId, x: nx, y: ny,
    drawing: true, color: drawColor,
    lineWidth: drawLineWidth / drawCanvas.width
  });
}, { passive: false });

drawCanvas.addEventListener('touchend', e => {
  if (myRole !== 'drawer') return;
  e.preventDefault();
  isDrawing = false;
  drawCtx?.beginPath();
  socket?.emit('team:draw', {
    gameId, x: 0, y: 0,
    drawing: false, color: drawColor,
    lineWidth: drawLineWidth / drawCanvas.width
  });
}, { passive: false });

// --- Pensel-inställningar ---
document.querySelectorAll('.brushBtn').forEach(btn => {
  btn.onclick = () => { drawLineWidth = parseInt(btn.dataset.size); };
});
document.getElementById('colorPicker').oninput = e => { drawColor = e.target.value; };

// Rensa canvas (ritaren klickar, broadcast till alla)
document.getElementById('clearCanvasBtn').onclick = () => {
  drawCtx?.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  socket?.emit('team:clearCanvas', { gameId });
};

// ====== Socket.io-händelsehanterare ======
function bindSocketEvents() {

  // --- Spelet skapades (host) ---
  socket.on('teamGame:created', ({ gameId: gid, code, teams, totalRounds: tr }) => {
    gameId          = gid;
    totalRounds     = tr;
    currentGameCode = code;
    buildTeamColorMap(teams); // Registrera lagfärger en gång

    // Övergå till väntrummet (Vy C)
    showLobbySubView('waitingRoomView');

    // Visa spelkod och info enbart för hosten
    document.getElementById('gameCodeValue').textContent = code;
    document.getElementById('hostCodeSection').classList.remove('hidden');

    // Visa och aktivera starta-knappen (disabled initialt)
    document.getElementById('startTeamGameBtn').classList.remove('hidden');

    // Visa lagknapparna direkt för hosten (kod behövs inte)
    renderLobbyTeamBtns(teams);

    // Uppdatera live-listan med de nyskapade lagen
    renderLobbyTeams(teams);
  });

  // --- Lobby uppdaterad (live-spelare per lag) – tas emot av alla i rummet ---
  socket.on('teamLobby:update', ({ teams }) => {
    buildTeamColorMap(teams); // Uppdatera färgmappning om lag tillkommer

    // Uppdatera live-listan för alla
    renderLobbyTeams(teams);

    // Visa/uppdatera lagknapparna om join-formuläret fortfarande är synligt (spelare har inte valt lag än)
    const joinSection = document.getElementById('lobbyJoinSection');
    if (joinSection && joinSection.style.display !== 'none') {
      renderLobbyTeamBtns(teams);
    }

    // Hosten kontrollerar om starta-knappen ska aktiveras
    if (isHost) checkStartEnabled(teams);
  });

  // --- Spelare gick med i ett lag (bekräftelse från servern) ---
  socket.on('player:teamJoined', ({ gameId: gid, playerId, teamId, teamName }) => {
    gameId     = gid;
    myPlayerId = playerId;
    myTeamName = teamName;
    myTeamId   = teamId;
    myRole     = 'guesser'; // Grundroll för spelare (kan bli 'drawer' senare)

    // Dölj join-formuläret nu när spelaren valt lag
    document.getElementById('lobbyJoinSection').style.display = 'none';
  });

  // --- En delomgång startar (alla tar emot detta) ---
  socket.on('team:roundStarted', ({ round, totalRounds: tr, drawingTeamName, drawerName, teamIndex }) => {
    totalRounds = tr;

    // Uppdatera rubriken
    document.getElementById('roundInfo').textContent  = `Omgång ${round}/${tr}`;
    document.getElementById('roundInfo').classList.remove('hidden');
    document.getElementById('drawingInfo').textContent = `${drawingTeamName} ritar`;
    document.getElementById('drawingInfo').classList.remove('hidden');
    document.getElementById('gameStatusText').textContent =
      `${drawingTeamName} – ${drawerName} ritar just nu`;

    // Avgör roll baserat på om spelaren är i ritarlaget
    // (hosten är nu en riktig spelare och tilldelas en roll precis som alla andra)
    if (myTeamName === drawingTeamName) {
      // I ritarlaget: kan vara gissare eller ritaren (avgörs av team:cityChoices)
      myRole = 'guesser';
    } else {
      // I motståndarlaget: åskådare
      myRole = 'spectator';
    }

    // Återställ canvas-tillstånd
    prevDrawPoint   = null;
    isDrawing       = false;
    mapClickEnabled = false;

    showView('gameView');
    prepareGameView();
  });

  // --- Ritarens stadval (bara ritaren tar emot detta) ---
  socket.on('team:cityChoices', ({ cities }) => {
    myRole = 'drawer';
    prepareGameView();

    document.getElementById('cityChoiceSection').classList.remove('hidden');
    const btnsContainer = document.getElementById('cityChoiceBtns');
    btnsContainer.innerHTML = '';
    cities.forEach((city, i) => {
      const btn = document.createElement('button');
      btn.textContent  = city;
      btn.style.padding = '8px 14px';
      btn.onclick = () => {
        // Visa väntemeddelande, dölj val-knapparna
        btnsContainer.innerHTML = '<span class="muted">⏳ Väntar på bekräftelse...</span>';
        socket.emit('team:chooseCity', { gameId, cityIndex: i });
      };
      btnsContainer.appendChild(btn);
    });
  });

  // --- Stad vald: bekräftelse till ritaren ---
  socket.on('team:cityChosen', ({ cityName }) => {
    document.getElementById('cityChoiceSection').classList.add('hidden');
    document.getElementById('drawerCanvasSection').classList.remove('hidden');
    document.getElementById('drawerWaitText').classList.remove('hidden');
    document.getElementById('gameStatusText').textContent = `Du ritar: ${cityName}`;

    // Initiera canvas med korrekt storlek
    setTimeout(() => {
      resizeCanvas(drawCanvas);
      drawCtx = drawCanvas.getContext('2d');
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    }, 50);
  });

  // --- Ritning har börjat (alla utom ritaren) ---
  socket.on('team:drawingStarted', ({ drawerName, teamName }) => {
    document.getElementById('gameStatusText').textContent =
      `${teamName} – ${drawerName} ritar just nu`;

    // Initiera viewCanvas
    setTimeout(() => {
      resizeCanvas(viewCanvas);
      viewCtx = viewCanvas.getContext('2d');
      viewCtx.clearRect(0, 0, viewCanvas.width, viewCanvas.height);
      prevDrawPoint = null;
    }, 50);
  });

  // --- Rita i realtid (broadcast till alla) ---
  socket.on('team:draw', ({ x, y, drawing, color, lineWidth }) => {
    // Alla som inte är ritaren ritar på viewCanvas
    if (myRole !== 'drawer') {
      if (!viewCanvas.width || !viewCanvas.height) resizeCanvas(viewCanvas);
      drawOnViewCanvas(x, y, drawing, color, lineWidth);
    }
  });

  // --- Rensa canvas (broadcast) ---
  socket.on('team:clearCanvas', () => {
    prevDrawPoint = null;
    viewCtx?.clearRect(0, 0, viewCanvas.width, viewCanvas.height);
  });

  // --- Gissning accepterad (bara gissaren tar emot) ---
  socket.on('team:guessAccepted', ({ km }) => {
    document.getElementById('guessStatus').textContent =
      `✅ Gissning registrerad: ${km} km – väntar på resultatet...`;
    mapClickEnabled = false;
  });

  // --- Delomgångsresultat (alla tar emot) ---
  socket.on('team:subRoundResults', ({ teamName, guesses, teamScore, target, teams }) => {
    buildTeamColorMap(teams); // Säkerställ att lagfärger är konfigurerade för alla klienter
    showView('resultsView');
    initResultMap();
    resultLayer.clearLayers();

    // Markera rätt stad på kartan
    L.marker([target.lat, target.lng])
      .addTo(resultLayer)
      .bindPopup(`✅ Rätt svar: ${target.name}`)
      .openPopup();

    // Rita varje gissning med en markör och linje till rätt svar.
    // Varje spelare i laget får en unik färg för att särskilja gissningarna visuellt.
    if (guesses?.length) {
      guesses.forEach((g, i) => {
        if (!g.guess) return;
        const color = TEAM_COLORS[i % TEAM_COLORS.length];
        L.circleMarker([g.guess.lat, g.guess.lng], {
          radius: 8, weight: 2, color: '#000', fillColor: color, fillOpacity: 0.85
        }).addTo(resultLayer).bindPopup(`${g.playerName}: ${g.km} km`);
        L.polyline(
          [[g.guess.lat, g.guess.lng], [target.lat, target.lng]],
          { weight: 2, opacity: 0.7, dashArray: '4 6', color }
        ).addTo(resultLayer);
      });
      try {
        resultMap.fitBounds(resultLayer.getBounds(), { padding: [30, 30], maxZoom: 8 });
      } catch (e) { /* fitBounds kan kasta om bounds är tomma */ }
    }

    // Visa textresultat för delomgången (spelare inom laget har varsin unik färg)
    const guessList = (guesses || [])
      .map((g, i) => {
        const color = TEAM_COLORS[i % TEAM_COLORS.length];
        return `<span style="color:${color}">${g.playerName}</span>: ${g.km ?? '—'} km`;
      })
      .join('<br/>');
    document.getElementById('subRoundResult').innerHTML = `
      <strong>${teamName}</strong> gissade på: <strong>${target.name}</strong><br/>
      ${guessList}<br/>
      <strong>Lag-poäng denna omgång: ${teamScore} km</strong>
    `;

    // Uppdatera lagställning
    renderTeamStandings(teams);

    // Visa "Nästa"-knappen bara för hosten
    if (isHost) {
      document.getElementById('nextSubRoundBtn').classList.remove('hidden');
    }

    // Återställ gissmarkör
    mapClickEnabled = false;
    if (myGuessMarker) { guessMap?.removeLayer(myGuessMarker); myGuessMarker = null; }
  });

  // --- Slutresultat (alla tar emot) ---
  socket.on('teamGame:final', ({ leaderboard }) => {
    renderFinalResults(leaderboard || []);
  });
}

// ====== Förbereder spelvyn beroende på aktuell roll ======
function prepareGameView() {
  // Dölj alla spelsektioner
  document.getElementById('cityChoiceSection').classList.add('hidden');
  document.getElementById('drawerCanvasSection').classList.add('hidden');
  document.getElementById('viewerCanvasSection').classList.add('hidden');
  document.getElementById('mapSection').classList.add('hidden');

  if (myRole === 'drawer') {
    // Ritaren: stadval visas (cityChoiceSection hanteras av team:cityChoices)
    document.getElementById('cityChoiceSection').classList.remove('hidden');

  } else if (myRole === 'guesser') {
    // Gissaren: viewCanvas (skrivskyddad) + klickbar karta
    document.getElementById('viewerCanvasSection').classList.remove('hidden');
    document.getElementById('mapSection').classList.remove('hidden');
    document.getElementById('guessStatus').textContent = 'Placera nålen på kartan!';
    mapClickEnabled = true;
    initGuessMap();
    guessLayer?.clearLayers();
    if (myGuessMarker) { guessMap?.removeLayer(myGuessMarker); myGuessMarker = null; }
    setTimeout(() => {
      resizeCanvas(viewCanvas);
      viewCtx = viewCanvas.getContext('2d');
      viewCtx?.clearRect(0, 0, viewCanvas.width, viewCanvas.height);
      prevDrawPoint = null;
    }, 50);
    setTimeout(() => guessMap?.invalidateSize(), 150);

  } else if (myRole === 'spectator') {
    // Motståndarlaget: viewCanvas + inaktiv karta (ingen klick-gissning)
    document.getElementById('viewerCanvasSection').classList.remove('hidden');
    document.getElementById('mapSection').classList.remove('hidden');
    mapClickEnabled = false;
    const drawingInfoText = document.getElementById('drawingInfo').textContent;
    document.getElementById('guessStatus').textContent =
      `${drawingInfoText} – din karta är inaktiv denna omgång`;
    initGuessMap();
    setTimeout(() => {
      resizeCanvas(viewCanvas);
      viewCtx = viewCanvas.getContext('2d');
      viewCtx?.clearRect(0, 0, viewCanvas.width, viewCanvas.height);
      prevDrawPoint = null;
    }, 50);
    setTimeout(() => guessMap?.invalidateSize(), 150);
  }
}

// ====== Hjälpfunktioner ======

// Renderar lagknappar i join-formuläret med aktuellt spelarantal och maxgräns från servern
function renderLobbyTeamBtns(teams) {
  const container = document.getElementById('lobbyTeamBtns');
  container.innerHTML = '';

  teams.forEach(team => {
    const color      = getTeamColor(team.name);
    const maxPlayers = team.maxPlayers || MAX_PLAYERS_PER_TEAM;
    // Räkna bara faktiska spelare (inte tomma platser med id === null)
    const count  = (team.players || []).filter(p => p.id !== null).length;
    const isFull = count >= maxPlayers;
    const btn    = document.createElement('button');
    btn.textContent    = isFull
      ? `${team.name} (fullt)`
      : `Gå med i ${team.name} (${count}/${maxPlayers})`;
    btn.disabled       = isFull;
    btn.style.background = isFull ? '#bbb' : color;
    btn.style.color      = '#fff';
    btn.style.margin     = '4px';
    btn.style.border     = 'none';
    btn.style.borderRadius = '6px';
    btn.style.padding    = '8px 14px';
    btn.style.cursor     = isFull ? 'default' : 'pointer';
    if (!isFull) {
      btn.onclick = () => handleJoinTeamClick(team.id);
    }
    container.appendChild(btn);
  });

  container.style.display = 'flex';
}

// Visar anslutna spelare per lag med grön/grå anslutningsprick i lobby-listan
function renderLobbyTeams(teams) {
  const container = document.getElementById('lobbyTeamsList');
  if (!teams?.length) { container.innerHTML = ''; return; }
  container.innerHTML =
    '<strong style="display:block;margin-bottom:6px">Anslutna spelare per lag:</strong>';
  teams.forEach((team, i) => {
    const color = teamColorMap.has(team.name)
      ? getTeamColor(team.name)
      : TEAM_COLORS[i % TEAM_COLORS.length];
    const div = document.createElement('div');
    div.style.margin = '4px 0';
    // Visa varje plats: grön prick = ansluten spelare, grå prick = tom plats
    const players = (team.players || []).map(p => {
      if (!p.name) {
        // Tom plats (id === null)
        return '<span class="dot-offline"></span><span class="muted">Tom plats</span>';
      }
      const connected = p.connected !== false; // explicit false → offline, annars online
      const dot = connected
        ? '<span class="dot-online"></span>'
        : '<span class="dot-offline"></span>';
      return `${dot}${p.name}`;
    }).join(', ') || '<span class="muted">—</span>';
    div.innerHTML = `
      <span class="team-badge" style="background:${color}">${team.name}</span>
      <span style="margin-left:6px;font-size:13px">${players}</span>
    `;
    container.appendChild(div);
  });
}

// Aktiverar starta-knappen om alla lag har fyllt sina platser med anslutna spelare
function checkStartEnabled(teams) {
  if (!teams?.length) return;
  const allReady = teams.every(t => {
    const maxPlayers = t.maxPlayers || 2;
    const connectedCount = (t.players || []).filter(p => p.connected === true).length;
    return connectedCount >= maxPlayers;
  });
  const btn = document.getElementById('startTeamGameBtn');
  btn.disabled    = !allReady;
  btn.textContent = allReady ? '▶ Starta spelet' : '⏳ Väntar på spelare...';
}

// Renderar lagställning sorterat på lägst totalt km (lägre = bättre)
function renderTeamStandings(teams) {
  const list = document.getElementById('teamStandings');
  list.innerHTML = '';
  if (!teams?.length) return;

  const sorted = [...teams].sort((a, b) => (a.totalScore || 0) - (b.totalScore || 0));
  sorted.forEach((team, i) => {
    const color = getTeamColor(team.name); // Konsekvent lagfärg baserat på ursprungsordning
    const rank  = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
    const li = document.createElement('li');
    li.innerHTML = `
      <span>${rank} <span style="color:${color};font-weight:600">${team.name}</span></span>
      <strong>${team.totalScore ?? 0} km</strong>
    `;
    list.appendChild(li);
  });
}

// Visar slutresultat-modalen med lagrankning och medaljer
function renderFinalResults(leaderboard) {
  const list = document.getElementById('finalList');
  list.innerHTML = '';
  leaderboard.forEach((team, i) => {
    const color = getTeamColor(team.name); // Behåll konsekvent lagfärg
    const rank  = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
    const li = document.createElement('li');
    li.innerHTML = `
      <span>${rank} <span style="color:${color};font-weight:600">${team.name}</span></span>
      <strong>${team.totalScore ?? 0} km</strong>
    `;
    list.appendChild(li);
  });
  document.getElementById('finalModal').style.display = 'flex';
}

document.getElementById('finalClose').onclick = () => {
  document.getElementById('finalModal').style.display = 'none';
};

// Nästa delomgång (bara hosten)
document.getElementById('nextSubRoundBtn').onclick = function () {
  socket?.emit('host:nextTeamSubRound', { gameId });
  this.classList.add('hidden');
  showView('gameView');
};
</script>
